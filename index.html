<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de links Senac</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
  <img src="img/logoSenacBlack.svg" alt="Logo Senac" class="w-[120px] h-[60px] ml-[17px] mt-[26px]"/>
    </header>

    <main>

        <section class="flex flex-col items-center">
            <h1 class="font-Urbanist text-center text-[96px]">Bem-vindo ao <span class="mt-[-55px] block bg-gradient-to-r from-[#6541B3] to-[#CCC0E5] bg-clip-text text-transparent font-bold text-5xl md:text-[96px] leading-tight">Hub de Links Senac</span></h1>

            <p class="font-Urbanist text-center text-5xl max-w-[706px] max-h-[116px]">Todos os links de sistemas e portais do  Senac em um só lugar</p>
        </section>

        <section>
            <h3 class="font-Urbanist text-5xl font-bold mt-[81px] text-center">Selecione seu Perfil:</h3>

            <div class="flex justify-center gap-[151px] mt-[44px]">
                <a href="estudante.html" class="flex flex-col items-center w-[300px] h-[343px] rounded-[27px] border-[5px] border-[#D8CFEB] hover:text-[#FFF] bg-transparent hover:bg-[#AB91E3] hover:border-[#AB91E3]">
                    <P class="font-Urbanist text-4xl font-medium  text-center mt-8 mb-12">Sou estudante</P>
                    <img src="img/student.png" alt="" class="w-[160px] h-[160px]">
                </a>
                <a href="funcionario.html" class="flex flex-col items-center w-[300px] h-[343px] rounded-[27px] border-[5px] border-[#D8CFEB] hover:text-[#FFF] bg-transparent hover:bg-[#AB91E3] hover:border-[#AB91E3]">
                    <P class="font-Urbanist text-4xl font-medium  text-center mt-8 mb-12">Sou funcionário</P>
                    <img src="img/man.png" alt="" class="w-[160px] h-[160px]">
                </a>
                <a href="visitante.html" class="flex flex-col items-center w-[300px] h-[343px] rounded-[27px] border-[5px] border-[#D8CFEB] hover:text-[#FFF] bg-transparent hover:bg-[#AB91E3] hover:border-[#AB91E3]">
                    <P class="font-Urbanist text-4xl font-medium  text-center mt-8 mb-12">Sou visitante</P>
                    <img src="img/user.png" alt="" class="w-[160px] h-[160px]">
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p class="font-Urbanist text-[20px] font-light text-center mt-[50px]">feito por: <span class="text-[#9076C8]">Diones G Angelo</span></p>
    </footer>
</body>
</html>
