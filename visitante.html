<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de links Senac</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="flex justify-center gap-[776px] mt-2 pb-2.5 border-b border-black/20 ">
        <div class="flex items-center gap-3">
            <img src="img/LogoinlineSenac.svg" alt="Logo do Senac">
            <img src="img/Line 1.png" alt="Separador">
            <h3 class="font-Urbanist text-2xl bg-gradient-to-r from-[#6541B3] to-[#CCC0E5] bg-clip-text text-transparent">Hub de Links Senac</h3>
        </div>

        <div class="flex gap-[25px]">
            <button class="rounded-[19px] bg-[#EFE9FF] w-[157px] h-[38px] font-Urbanist text-[#8176DA] text-[18px] font-semibold">Perfil: Visitante</button>
            <a href="index.html" class="inline-flex items-center justify-center w-[157px] h-[38px] text-[#AB91E3] font-Urbanist text-[18px] font-semibold rounded-[19px] bg-[#FFF] border-2 border-[#AB91E3] hover:bg-[#AB91E3] hover:text-[#F3F3F3]">Trocar Perfil</a>
        </div>
    </header>

    <main>
<section class="flex justify-between ml-20 mr-52 mt-[50px] mb-[30px]">
  <div>
      <h1 class="font-['Urbanist'] font-extrabold text-4xl md:text-[70px] leading-tight text-black flex flex-col gap-2">
        <span>Reunimos Todos</span>
        <div class="flex items-baseline gap-3 md:gap-4 whitespace-nowrap">
          <span>Os Links</span>
          <span class="bg-gradient-to-r from-[#6541B3] to-[#CCC0E5] bg-clip-text text-transparent text-[70px]">
            Necessários
          </span>
        </div>
        <div class="flex items-baseline gap-3 md:gap-4 whitespace-nowrap">
          <span>Pra Você</span>
          <span class="italic text-transparent [-webkit-text-stroke:2px_black]">
            Visitante
          </span>
        </div>
      </h1>
      <p class="font-['Urbanist'] font-light text-xl text-gray-500 mt-4">
        role a página pra ver seus links
      </p>
  </div>

  <img src="img/heroImg.svg" alt="Ilustração">

</section>

<section class="bg-[##F8F8FA]">
    <h3 class="font-Urbanist">Mais usados</h3>
    <p class="font-Urbanist">Seus acessos do dia a dia, a um clique</p>

</section>
    </main>
</body>
</html>
